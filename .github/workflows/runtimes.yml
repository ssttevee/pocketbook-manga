name: Publish JVM builders

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builder:
    name: ARMv7 / glibc ${{ matrix.glibc }}
    # Builder images contain cross compilers and JVM build dependencies only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        glibc: ['2.23', '2.39']
    steps:
      - uses: actions/checkout@v4
      - name: Make room for cross compiler and OpenJDK builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish cross compiler and JVM build dependencies
        id: builder
        uses: docker/build-push-action@v6
        with:
          context: tools/jre
          target: deps
          platforms: linux/arm64
          push: true
          build-args: GLIBC_VERSION=${{ matrix.glibc }}
          tags: |
            ghcr.io/ssttevee/pocketmanga-jvm-builder:glibc-${{ matrix.glibc }}-${{ github.sha }}
            ghcr.io/ssttevee/pocketmanga-jvm-builder:glibc-${{ matrix.glibc }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=builder-${{ matrix.glibc }}
          cache-to: type=gha,scope=builder-${{ matrix.glibc }},mode=max,ignore-error=true
      - name: Record the published builder for review
        env:
          GLIBC: ${{ matrix.glibc }}
          IMAGE: ghcr.io/ssttevee/pocketmanga-jvm-builder@${{ steps.builder.outputs.digest }}
        run: |
          printf 'glibc %s builder: %s\n' "$GLIBC" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
