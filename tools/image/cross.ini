[binaries]
c = 'arm-pocketbook-linux-gnueabi-gcc'
cpp = 'arm-pocketbook-linux-gnueabi-g++'
ar = 'arm-pocketbook-linux-gnueabi-ar'
strip = 'arm-pocketbook-linux-gnueabi-strip'
pkg-config = 'pkg-config'
[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'cortex-a7'
endian = 'little'
[properties]
needs_exe_wrapper = true
[built-in options]
c_args = ['-O2', '-fPIC']
cpp_args = ['-O2', '-fPIC']
